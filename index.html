<!doctype html>
<html lang="en" data-contrast="standard" data-motion="full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#070b1a" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="Orbit Shift: a one-touch orbital gravity puzzle with 120 levels. Plays offline." />
    <!-- Inlined, so the page makes no request at all for its tab icon. -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23070b1a'/%3E%3Ccircle cx='32' cy='32' r='19' fill='none' stroke='%234fe3c8' stroke-width='3' stroke-dasharray='7 5'/%3E%3Ccircle cx='32' cy='32' r='8' fill='%23b49cff'/%3E%3Cpath d='M32 7l7 14H25z' fill='%23ffb454'/%3E%3C/svg%3E" />
    <title>Orbit Shift</title>
    <style>
      /* Painted before any script runs, so the first frame is already the game's colours. */
      html, body { margin: 0; background: #070b1a; }
      #splash { position: fixed; inset: 0; z-index: 20; display: flex; align-items: center; justify-content: center;
        background: #070b1a; color: #eaf0ff; font: italic 400 44px/1 Georgia, serif; letter-spacing: -0.01em; text-align: center; padding: 24px; }
      #splash b { color: #ffb454; font-weight: 400; }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="game" role="region" aria-label="Playfield"></div>
      <div id="ui" class="ui"></div>
      <div id="live" class="sr-only" role="status" aria-live="polite"></div>
      <div id="splash">Orbit <b>&nbsp;Shift</b></div>
      <noscript>Orbit Shift needs JavaScript to run.</noscript>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
